name: Check learning product
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm test
      - run: python -m unittest discover -s tests -p "*_test.py"
      - run: npm run build
      - run: python tests/build_smoke.py
